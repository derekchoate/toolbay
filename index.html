<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toolbay</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Window Controls (visible during development) -->
    <div class="window-controls">
      <button id="close-btn" class="window-control close" title="Close (hide)">✕</button>
    </div>

    <main class="container">
      <!-- Header -->
      <header class="app-header">
        <h1>Toolbay</h1>
        <p class="subtitle">Background tool supervisor</p>
      </header>

      <!-- Tool List Section -->
      <section id="tool-list-section" class="card tool-list-card">
        <div class="tool-list-header">
          <span class="status-label">Installed Tools</span>
          <button id="register-tool-btn" class="btn btn-sm">+ Register Tool</button>
        </div>
        <div id="tool-list" class="tool-list">
          <!-- Tool cards are rendered here dynamically -->
          <p class="empty-state" id="empty-tools-msg">No tools registered. Click "+ Register Tool" to add one.</p>
        </div>
      </section>

      <!-- Footer -->
      <footer class="app-footer">
        <p>Toolbay v0.1.0 — macOS menu bar supervisor</p>
      </footer>
    </main>

    <!-- Tool Card Template (hidden, used for cloning) -->
    <template id="tool-card-template">
      <div class="tool-card" data-tool-id="">
        <!-- Tool Header -->
        <div class="tool-card-header">
          <div class="tool-info">
            <span class="tool-display-name"></span>
            <span class="tool-id-badge"></span>
          </div>
          <span class="status-badge stopped">● Stopped</span>
        </div>

        <!-- Install Message -->
        <p class="install-msg" data-installed="false">Not installed</p>

        <!-- Action Buttons -->
        <div class="tool-actions">
          <button class="btn btn-primary tool-install-btn" disabled>Install</button>
          <button class="btn btn-success tool-start-btn" disabled>Start</button>
          <button class="btn btn-danger tool-stop-btn" disabled>Stop</button>
          <button class="btn btn-warning tool-restart-btn" disabled>Restart</button>
          <button class="btn btn-secondary tool-uninstall-btn">Uninstall</button>
        </div>

        <!-- Logs Section -->
        <div class="tool-logs">
          <div class="logs-header">
            <span class="status-label">Logs</span>
            <div class="log-actions">
              <button class="btn btn-sm tool-stream-btn">▶ Stream</button>
              <button class="btn btn-sm tool-refresh-btn">Refresh</button>
            </div>
          </div>
          <pre class="tool-log-output">(No logs)</pre>
        </div>
      </div>
    </template>
  </body>
</html>
