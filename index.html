<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toolbay</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Window Controls (visible during development) -->
    <div class="window-controls">
      <button id="close-btn" class="window-control close" title="Close (hide)">✕</button>
    </div>

    <main class="container">
      <!-- Header -->
      <header class="app-header">
        <h1>Toolbay</h1>
        <p class="subtitle">Background tool supervisor</p>
      </header>

      <!-- Status Card -->
      <section class="card status-card" id="status-card">
        <div class="status-card-header">
          <span class="status-label">Status</span>
          <span id="status-badge" class="status-badge stopped">● Stopped</span>
        </div>
        <p id="install-msg" class="install-msg" data-installed="false">Not installed</p>
      </section>

      <!-- Control Buttons -->
      <section class="card actions-card">
        <div class="button-row primary-actions">
          <button id="install-btn" class="btn btn-primary">Install</button>
          <button id="start-btn" class="btn btn-success" disabled>Start</button>
          <button id="stop-btn" class="btn btn-danger" disabled>Stop</button>
          <button id="restart-btn" class="btn btn-warning" disabled>Restart</button>
        </div>
        <div class="button-row">
          <button id="uninstall-btn" class="btn btn-secondary">Uninstall</button>
        </div>
      </section>

      <!-- Logs Section -->
      <section class="card logs-card">
        <div class="logs-header">
          <span class="status-label">Logs</span>
          <div class="log-actions">
            <button id="stream-logs-btn" class="btn btn-sm">▶ Stream</button>
            <button id="refresh-logs-btn" class="btn btn-sm">Refresh</button>
            <button id="open-logs-dir-btn" class="btn btn-sm">Open Logs Dir</button>
          </div>
        </div>
        <pre id="log-output" class="log-output">(Loading…)</pre>
      </section>

      <!-- Footer -->
      <footer class="app-footer">
        <p>Toolbay v0.1.0 — macOS menu bar supervisor</p>
      </footer>
    </main>
  </body>
</html>
